<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d">
  <title id="t">The vibe coding journey</title>
  <desc id="d">Four stages: Idea (pick your tool), Build (69 tools, 18 free), Launch (ship-ready checklist), Keep alive (debug, monitor, grow).</desc>
  <rect width="1200" height="260" rx="24" fill="#fbfaff" stroke="#e7e3ff"/>
  <line x1="170" y1="100" x2="1030" y2="100" stroke="#d9d4ff" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
    <circle cx="170" cy="100" r="46" fill="#ede9ff" stroke="#7c5cff" stroke-width="3"/>
    <text x="170" y="112" font-size="34">💡</text>
    <text x="170" y="184" fill="#151a33" font-size="21" font-weight="600">1. Idea</text>
    <text x="170" y="212" fill="#5b6280" font-size="16">pick your tool</text>
    <circle cx="457" cy="100" r="46" fill="#e0f7fb" stroke="#0ea5c6" stroke-width="3"/>
    <text x="457" y="112" font-size="34">🛠️</text>
    <text x="457" y="184" fill="#151a33" font-size="21" font-weight="600">2. Build</text>
    <text x="457" y="212" fill="#5b6280" font-size="16">69 tools, 18 free</text>
    <circle cx="743" cy="100" r="46" fill="#fff4e0" stroke="#f59e0b" stroke-width="3"/>
    <text x="743" y="112" font-size="34">🚀</text>
    <text x="743" y="184" fill="#151a33" font-size="21" font-weight="600">3. Launch</text>
    <text x="743" y="212" fill="#5b6280" font-size="16">ship-ready checklist</text>
    <circle cx="1030" cy="100" r="46" fill="#e5f8ea" stroke="#16a34a" stroke-width="3"/>
    <text x="1030" y="112" font-size="34">💚</text>
    <text x="1030" y="184" fill="#151a33" font-size="21" font-weight="600">4. Keep alive</text>
    <text x="1030" y="212" fill="#5b6280" font-size="16">debug, monitor, grow</text>
  </g>
</svg>
