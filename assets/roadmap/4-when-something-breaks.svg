<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" width="240" height="150" role="img" aria-labelledby="t d">
  <title id="t">Stage 4: When something breaks</title>
  <desc id="d">Stage 4 of 5 on the roadmap: When something breaks. It will happen, and it is fixable. Use the same calm method every time, whatever tool you use.</desc>
  <rect x="1" y="1" width="238" height="148" rx="18" fill="#0f1529" stroke="#ef4444" stroke-width="2"/>
  <circle cx="40" cy="42" r="22" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="2"/>
  <text x="40" y="50" font-size="22" text-anchor="middle">🛟</text>
  <text x="72" y="38" fill="#ef4444" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">STEP 4 →</text>
  <text x="72" y="58" fill="#e6e9f5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700">When it breaks</text>
  <text x="22" y="92" fill="#aab2d5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">• Reproduce it</text>
  <text x="22" y="112" fill="#aab2d5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">• Read the real error</text>
  <text x="22" y="132" fill="#aab2d5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">• Find the change</text>
</svg>
