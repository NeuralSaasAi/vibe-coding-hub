<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Vibe Coding Hub</title>
  <desc id="d">A terminal prompt reading &quot;build me an app that actually stays up&quot;, followed by: 69 tools across 8 categories; 18 free tiers, 16 prices checked on vendor pages; launch checklist + what to do when it breaks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#e0f7fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect x="60" y="50" width="1080" height="280" rx="16" fill="#ffffff" stroke="#d9d4ff"/>
  <circle cx="92" cy="80" r="7" fill="#ff5f57"/>
  <circle cx="116" cy="80" r="7" fill="#febc2e"/>
  <circle cx="140" cy="80" r="7" fill="#28c840"/>
  <text x="600" y="86" fill="#5b6280" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle">Vibe Coding Hub</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26">
    <text x="100" y="148" fill="#0e7490">&gt;</text>
    <text x="130" y="148" fill="#151a33">build me an app that actually stays up</text>
    <rect x="736" y="127" width="14" height="26" fill="#0e7490">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20">
    <text x="130" y="204" fill="#16a34a">✓</text>
    <text x="160" y="204" fill="#3f4766">69 tools across 8 categories</text>
    <text x="130" y="240" fill="#16a34a">✓</text>
    <text x="160" y="240" fill="#3f4766">18 free tiers, 16 prices checked on vendor pages</text>
    <text x="130" y="276" fill="#16a34a">✓</text>
    <text x="160" y="276" fill="#3f4766">launch checklist + what to do when it breaks</text>
  </g>
  <rect x="60" y="345" width="1080" height="4" rx="2" fill="url(#accent)"/>
</svg>
